server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation: lets the browser lane share memory between Web Workers
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Large runs can take a while
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/rust/   { proxy_pass http://rust:8000/; }
    location /api/python/ { proxy_pass http://python:8000/; }
    location /api/node/   { proxy_pass http://node:8000/; }

    location / { try_files $uri $uri/ =404; }
}
